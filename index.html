<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
<title>Kolko i krzyzyk</title>
<link rel="stylesheet" href="style.css">
<script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script>

       $(document).ready(function(){

    $('#start').click(function(){
        let graczX = $('#graczX').val();
        let graczO = $('#graczO').val();

        if(graczX === '' || graczO === ''){
            alert('Wpisz imiona lub ksywki graczy');
        } else {
            $('.gracze').hide();
            $('.container').show();
            $('#nazwaGracza').show();
        }

        $('#nazwaGracza').text("Ruch gracza " + $('#graczX').val());
    });

    let licznik = 0;
    let wynikX = 0;
    let wynikO = 0;
    let koniecGry = false;

    $('#wynikX').text(wynikX);
    $('#wynikO').text(wynikO);

    $('.col-4').click(function(){

        if(koniecGry || $(this).text() !== ''){
            return;
        }

        licznik++;

        if(licznik % 2 === 1){
            $(this).text('X');
            $('#nazwaGracza').text("Ruch gracza " + $('#graczO').val());
        } else {
            $(this).text('O');
            $('#nazwaGracza').text("Ruch gracza " + $('#graczX').val());
        }

        let box1 = $('#1').text();
        let box2 = $('#2').text();
        let box3 = $('#3').text();
        let box4 = $('#4').text();
        let box5 = $('#5').text();
        let box6 = $('#6').text();
        let box7 = $('#7').text();
        let box8 = $('#8').text();
        let box9 = $('#9').text();

        if(box1=="X" && box2=="X" && box3=="X"){
            $('#1, #2, #3').addClass('wygrana');
            wynikX++;
        }
        else if(box4=="X" && box5=="X" && box6=="X"){
            $('#4, #5, #6').addClass('wygrana');
            wynikX++;
        }
        else if(box7=="X" && box8=="X" && box9=="X"){
            $('#7, #8, #9').addClass('wygrana');
            wynikX++;
        }
        else if(box1=="X" && box4=="X" && box7=="X"){
            $('#1, #4, #7').addClass('wygrana');
            wynikX++;
        }
        else if(box2=="X" && box5=="X" && box8=="X"){
            $('#2, #5, #8').addClass('wygrana');
            wynikX++;
        }
        else if(box3=="X" && box6=="X" && box9=="X"){
            $('#3, #6, #9').addClass('wygrana');
            wynikX++;
        }
        else if(box1=="X" && box5=="X" && box9=="X"){
            $('#1, #5, #9').addClass('wygrana');
            wynikX++;
        }
        else if(box3=="X" && box5=="X" && box7=="X"){
            $('#3, #5, #7').addClass('wygrana');
            wynikX++;
        }
        else if(box1=="O" && box2=="O" && box3=="O"){
            $('#1, #2, #3').addClass('wygrana');
            wynikO++;
        }
        else if(box4=="O" && box5=="O" && box6=="O"){
            $('#4, #5, #6').addClass('wygrana');
            wynikO++;
        }
        else if(box7=="O" && box8=="O" && box9=="O"){
            $('#7, #8, #9').addClass('wygrana');
            wynikO++;
        }
        else if(box1=="O" && box4=="O" && box7=="O"){
            $('#1, #4, #7').addClass('wygrana');
            wynikO++;
        }
        else if(box2=="O" && box5=="O" && box8=="O"){
            $('#2, #5, #8').addClass('wygrana');
            wynikO++;
        }
        else if(box3=="O" && box6=="O" && box9=="O"){
            $('#3, #6, #9').addClass('wygrana');
            wynikO++;
        }
        else if(box1=="O" && box5=="O" && box9=="O"){
            $('#1, #5, #9').addClass('wygrana');
            wynikO++;
        }
        else if(box3=="O" && box5=="O" && box7=="O"){
            $('#3, #5, #7').addClass('wygrana');
            wynikO++;
        }
        else if(licznik == 9){
            koniecGry = true;
            alert('Remis');
        }

        if(wynikX > 0 || wynikO > 0){
            $('#wynikX').text(wynikX);
            $('#wynikO').text(wynikO);
            koniecGry = true;
        }

    });

});

    </script>
</head>
    <body>
        <div class="container-fluid">
            <div class="row"><h1 class="col-12  text-center">Kółko i krzyżyk</h1></div>
            
        </div>
        <div class="gracze text-center">
            <input type="text" id="graczX" placeholder="Gracz X"><br>
            <input type="text" id="graczO" placeholder="Gracz O"><br><br>
            <button type="button" class="btn btn-outline-primary" id="start">Start</button>
        </div>
        <div class="container">
            <div class="row text-center">
                <div class="col-4" id="wynikXnapis">Wynik X</div>
                <div class="col-4" id="wynikOnapis">Wynik O</div>
                <div class="col-4" id="remisNapis">Remis</div>
            </div>
            <div class="row text-center">
                <div class="col-4" id="wynikX">0</div>
                <div class="col-4" id="wynikO">0</div>
                <div class="col-4" id="remis">0</div>
            </div>
        </div>
       
        <br>
        <div class="nazwaGracza">
            <p id="nazwaGracza" style="display: none;"></p>
        </div>
        <div class="container" style="display:none;">
            <div class="row text-center">
                <div class="col-4" id="1"></div>
                <div class="col-4" id="2"></div>
                <div class="col-4" id="3"></div>
            </div>
            <div class="row text-center">
                <div class="col-4" id="4"></div>
                <div class="col-4" id="5"></div>
                <div class="col-4" id="6"></div>
            </div>
            <div class="row text-center">
                <div class="col-4" id="7"></div>
                <div class="col-4" id="8"></div>
                <div class="col-4" id="9"></div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
    </body>
</html>
